[workspace]
members = [
    "packages/core",
    "packages/cli",
    "packages/policies/blend-yield-claim",
    "packages/policies/soroswap-bounded",
    "packages/policies/sep41-subscription",
    "tests",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "25.3.1" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
insta       = "1"

[profile.contract]
inherits         = "release"
opt-level        = "z"
overflow-checks  = true
debug            = 0
strip            = "symbols"
debug-assertions = false
panic            = "abort"
codegen-units    = 1
lto              = true
